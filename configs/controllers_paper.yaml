  c0: [14.0, 14.0, 8.0, 6.0]   # c4(0) = 6 ASSUMED (M13): printed as a second "c2(0) = 6"
  zeta: [0.3, 0.4, 0.4, 0.5]
  eps: 0.05                # dead zone, eq. (53)-(54)
  boundary_layer: 0.04     # varrho, eq. (55); applied to L only (M9)
