[project]
name = "ddmr"
version = "0.1.0"
description = "Robust finite-time trajectory tracking of a differential-drive robot (AFNTSMDC reproduction + improvement)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pandas",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddmr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
